name: Windows release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - VERSION
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python 3.12 x64
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          architecture: "x64"

      - name: Install Windows 11 dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install -r requirements-windows.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install pyinstaller==6.16.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "import numpy, pandas, openpyxl, xlrd; print('All runtime dependencies are installed')"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test application
        run: python -m unittest discover -s tests -v

      - name: Build application
        shell: pwsh
        run: |
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --onedir `
            --name Buhuchet `
            --python-option utf8 `
            --hidden-import openpyxl `
            --hidden-import xlrd `
            buhuchet.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item START_BUHUCHET.bat dist/Buhuchet/
          Copy-Item README_FOR_MOM.txt dist/Buhuchet/
          Copy-Item 'КАК_ЗАПОЛНЯТЬ_ТАБЛИЦЫ.txt' dist/Buhuchet/
          Copy-Item 'КРАТКАЯ_ПРОВЕРКА_МЕНЮ.txt' dist/Buhuchet/
          Copy-Item 'ПРИМЕР_ЗАПОЛНЕНИЯ_ТАБЛИЦЫ.xlsx' dist/Buhuchet/
          Copy-Item VERSION dist/Buhuchet/

      - name: Test packaged executable
        run: python tests/smoke_windows.py dist/Buhuchet

      - name: Package Windows 11 archive
        shell: pwsh
        run: |
          Compress-Archive -Path dist/Buhuchet/* -DestinationPath Buhuchet-Windows11-x64.zip
          $hash = (Get-FileHash Buhuchet-Windows11-x64.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  Buhuchet-Windows11-x64.zip" | Set-Content SHA256SUMS.txt -Encoding ascii

      - name: Upload test artifact
        uses: actions/upload-artifact@v5
        with:
          name: Buhuchet-Windows11-x64
          path: |
            Buhuchet-Windows11-x64.zip
            SHA256SUMS.txt

      - name: Publish GitHub release
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REF: ${{ github.ref }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($version -notmatch '^v\d+\.\d+\.\d+$') { throw 'Invalid VERSION' }
          if ($env:RELEASE_REF.StartsWith('refs/tags/') -and $env:RELEASE_REF -ne "refs/tags/$version") {
            throw 'Tag does not match VERSION'
          }
          gh release create $version `
            Buhuchet-Windows11-x64.zip SHA256SUMS.txt `
            --target $env:RELEASE_SHA `
            --title "Бухучёт $version — Windows 11 x64" `
            --notes-file RELEASE_NOTES.md `
            --latest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
