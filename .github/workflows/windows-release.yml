name: Windows release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.8 x64
        uses: actions/setup-python@v5
        with:
          python-version: "3.8"
          architecture: "x64"

      - name: Install compatible dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade "pip<25"
          python -m pip install -r requirements-win7.txt
          python -m pip install pyinstaller==5.13.2

      - name: Build application
        shell: pwsh
        run: |
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --onedir `
            --name Buhuchet `
            --hidden-import openpyxl `
            --hidden-import xlrd `
            buhuchet.py
          Copy-Item START_BUHUCHET.bat dist/Buhuchet/
          Copy-Item README_FOR_MOM.txt dist/Buhuchet/
          Compress-Archive -Path dist/Buhuchet/* -DestinationPath Buhuchet-Windows7-x64.zip

      - name: Upload test artifact
        uses: actions/upload-artifact@v4
        with:
          name: Buhuchet-Windows7-x64
          path: Buhuchet-Windows7-x64.zip

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            Buhuchet-Windows7-x64.zip `
            --title "Бухучёт ${{ github.ref_name }}" `
            --generate-notes
